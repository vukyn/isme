# isme — repo-local mprocs. Run `mprocs` (or `make mprocs`) from repo root.
# Procs run in the repo root, so no `cwd:` is needed.
# Browser host sso.isme.local; server-to-server calls use 127.0.0.1:<port>
# (*.local stalls ~5s on mDNS).
# Rarely-used targets stay in the Makefile: db-down/logs/reset,
# migrate-down/reset, gen-key-rsa256, v-tag, tag.
procs:
  run:
    shell: make run
    autostart: false
  build-run:
    # build-web (ui/ → internal/web/dist, go:embed) then run.
    shell: make build-web && make run
    autostart: false
  web:
    # Vite dev server (HMR) in ui/.
    shell: make web
    autostart: false
  db-up:
    # local Postgres (docker compose, host port 5433)
    shell: make db-up
    autostart: false
  migrate-up:
    # needs the database from db-up (or DB_* pointing elsewhere)
    shell: make migrate-up
    autostart: false
  test:
    # database tests start their own Postgres container — needs Docker
    shell: make test
    autostart: false
